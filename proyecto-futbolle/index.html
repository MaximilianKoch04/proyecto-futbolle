<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbolle</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/estilos-generales.css">
</head>
<body>
    
    <main id="pantalla-inicio" class="contenedor-inicio">
        <h1>Bienvenido a Futbolle</h1>
        <p>Adivina el jugador secreto en 8 intentos.</p>

        <form id="formulario-inicio">
            <label for="nombre-jugador">Ingresa tu nombre para jugar:</label>
            <input type="text" id="nombre-jugador" placeholder="Ej: Leo" autocomplete="off">
            
            <button type="submit" id="boton-iniciar">Iniciar Partida</button>
        </form>

        <div id="mensaje-error" class="oculto"></div>
    </main>
<section id="tablero-juego" class="oculto">
        <header id="cabecera-juego">
            <h2>Adivina el Jugador</h2>
            <div id="info-partida">
                <p>Intentos restantes: <span id="contador-intentos">8</span></p>
                <p>Tiempo: <span id="temporizador">00:00</span></p>
            </div>
        </header>

        <div id="contenedor-buscador">
            <label for="input-busqueda">Buscar jugador:</label>
            <div class="fila-buscador">
                <input type="text" id="input-busqueda" placeholder="Escribe un nombre..." autocomplete="off">
                <button type="button" id="boton-adivinar">Adivinar</button>
            </div>
            <ul id="lista-autocompletado" class="oculto"></ul>
        </div>

        <div id="contenedor-intentos">
            <div id="cabecera-atributos" class="oculto">
                <div class="atributo-titulo">Jugador</div>
                <div class="atributo-titulo">Nación</div>
                <div class="atributo-titulo">Liga</div>
                <div class="atributo-titulo">Equipo</div>
                <div class="atributo-titulo">Posición</div>
                <div class="atributo-titulo">Edad</div>
                <div class="atributo-titulo">Dorsal</div>
            </div>
            
            <div id="historial-intentos"></div>
        </div>

    <script src="js/logica-juego.js"></script>
</body>
</html>
